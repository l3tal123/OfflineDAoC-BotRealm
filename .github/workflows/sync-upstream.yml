name: Sync fork with upstream

# Keeps l3tal123/OfflineDAoC-BotRealm's main in sync with its parent
# shadowofze/OfflineDAoC-True165 by merging upstream/main into fork main.
#
# Fork note: GitHub disables Actions (and scheduled workflows) in a fork until
# the repository owner enables them: Settings > Actions > General > "Allow all
# actions". Then, under the Actions tab, enable this workflow if it is paused.
# The schedule below is a fallback; the local scripts/sync-upstream.ps1 and
# scripts/register-sync-task.ps1 do the same thing on this PC. See docs/FORK.md.
#
# The merge only ever fast-forwards or creates a merge commit. It never
# force-pushes; if upstream and the fork both changed the same lines the job
# fails and the conflict has to be resolved locally (docs/FORK.md).

on:
  schedule:
    # Daily at 05:17 UTC. Deliberately off the hour to avoid the GitHub rush.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what would be merged (do not merge or push)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-fork-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main into fork main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream main
        run: |
          git remote add upstream https://github.com/shadowofze/OfflineDAoC-True165.git 2>/dev/null || \
            git remote set-url upstream https://github.com/shadowofze/OfflineDAoC-True165.git
          git fetch upstream main --no-tags --prune

      - name: Report and merge
        id: merge
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse upstream/main)
          echo "Fork main:  ${head_sha}"
          echo "Upstream:   ${upstream_sha}"

          if git merge-base --is-ancestor HEAD upstream/main; then
            echo "Fork main is behind upstream; incoming commits:"
            git log --oneline --no-decorate HEAD..upstream/main
          elif git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            echo "already_uptodate=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Both sides have new commits; merging upstream/main into the fork."
            git log --oneline --no-decorate HEAD..upstream/main
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Dry run requested: not merging or pushing."
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "### Dry run" >> "$GITHUB_STEP_SUMMARY"
            echo "Incoming upstream commits:" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline --no-decorate HEAD..upstream/main >> "$GITHUB_STEP_SUMMARY" || true
            exit 0
          fi

          git merge --no-edit upstream/main
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Push fork main
        if: steps.merge.outputs.merged == 'true'
        run: git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Fork sync"
            echo "Fork main after job: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
            echo "Upstream main: $(git rev-parse --short upstream/main 2>/dev/null || echo unknown)"
          } >> "$GITHUB_STEP_SUMMARY"
